# PostEulen – Ergänzung für tor@posteulen (v0.9, SPEC 16.5). Erzeugt von deploy/tor.sh.
[Unit]
# Bleibt Tor nach den automatischen Neustarts liegen: Meldung ans Adminpanel.
OnFailure=posteulen-tor-failed.service

[Service]
# Im Adminpanel abgeschaltet: nicht starten – auch nicht beim Booten. „+“: ohne die Sandbox der
# Tor-Unit, damit die Schalter-Datei lesbar und die Meldung ans Adminpanel möglich ist.
ExecCondition=+/bin/sh -c '! grep -qx off /var/lib/posteulen/tor-switch 2>/dev/null'
# Tor läuft (wieder): Meldung ans Adminpanel; ein Fehler hier stoppt Tor nie („-“).
ExecStartPost=-+/opt/posteulen/current/deploy/tor.sh started
